name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Laufende Runs fuer denselben Branch abbrechen, wenn neue Commits kommen.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check music_sync tests
      - name: Ruff format check
        run: ruff format --check music_sync tests

  typecheck:
    name: Type Check (mypy, non-blocking)
    runs-on: ubuntu-latest
    # Nicht-blockierend: zeigt Findings, schlaegt den Merge aber nicht fehl.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (dev)
        run: pip install -e ".[dev]"
      - name: mypy
        run: mypy music_sync

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (dev)
        run: pip install -e ".[dev]"
      - name: "Pytest + Coverage (Gate 40%)"
        run: >-
          pytest
          --cov=music_sync
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=40
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: Build & CLI Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
      - name: CLI smoke test
        run: /tmp/smoke/bin/music-sync --help
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (load, kein Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: music-sync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image smoke test
        run: docker run --rm --entrypoint music-sync music-sync:ci --help

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency CVE scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
