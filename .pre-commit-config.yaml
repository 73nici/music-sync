# Lokale Qualitaets-Hooks, spiegeln die CI-Gates (ruff + gitleaks).
# Einrichten:  pip install pre-commit && pre-commit install
# Versionen aktualisieren:  pre-commit autoupdate
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
