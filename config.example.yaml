# Music-Sync Configuration Example
# Copy to config.yaml and adjust to your environment.

# Pfade
music_dir: /home/johncena/Musik
download_dir: /home/johncena/Musik

# Optional: YouTube Music Premium Cookies
# cookies_file: /home/johncena/.config/music-sync/cookies.txt

# Optional: bgutil PO-Token-Provider (für authentischere Requests an YouTube)
# Lokal:           http://127.0.0.1:4416
# Docker-Compose:  http://pot-provider:4416
# pot_provider_url: http://127.0.0.1:4416

# Verhalten
min_free_space_mb: 500
fuzzy_match_threshold: 85
log_level: INFO

# Adaptiver Scan-Zeitplan: Wie oft die Diskografie eines Künstlers neu von YT Music
# abgefragt wird — abhängig davon, wie lange dessen letztes Release her ist.
# Aktive Künstler werden bei jedem Lauf geprüft, inaktive fallen auf lange Intervalle
# zurück. Das spart API-Calls, ohne neue Releases zu verpassen.
#
# Bypass: `sync --all` (Zeitplan ignorieren), `sync --artist X`, `sync --refresh`.
# Überblick:  `music-sync schedule`
scan_schedule:
  enabled: true
  tiers:
    # max_age_days = Alter des neuesten bekannten Releases
    # interval_hours = frühestens nach so vielen Stunden erneut scannen (0 = jeder Lauf)
    - max_age_days: 30      # Release im letzten Monat
      interval_hours: 0
    - max_age_days: 180     # letztes halbes Jahr
      interval_hours: 12
    - max_age_days: 365     # letztes Jahr
      interval_hours: 24
    - max_age_days: 1095    # letzte 3 Jahre
      interval_hours: 72
    - interval_hours: 168   # alle übrigen (max_age_days weglassen = catch-all)

# Substrings die einen Song zum Skip führen (Studio-Only Filter)
filter_keywords:
  - "(Live)"
  - "(Acoustic)"
  - "(Remix)"
  - "(Cover)"
  - "(Demo)"
  - "(Instrumental)"
  - "(Karaoke)"

# Künstler-Mapping
# Pro Künstler genau eine Quelle angeben:
#   - ytmusic_id (Channel Browse-ID von music.youtube.com, beginnt oft mit UC oder MPAD)
#   - youtube_url (Fallback: regulärer YouTube-Kanal)
artists:
  - name: "Rammstein"
    ytmusic_id: "UCw39ZmFGboKvrHv4n6LviCA"

  - name: "Linkin Park"
    ytmusic_id: "UCZU9T1ceaOgwfLRq7OKFU4Q"

  # Beispiel: Künstler nicht auf YT Music verfügbar
  # - name: "Indie Band X"
  #   youtube_url: "https://youtube.com/@indiebandx"

# Optionale Playlists. Strikt getrennt von 'artists' — Tracks landen in einem eigenen
# Playlist-Ordner (siehe 'artist'-Feld) und werden NICHT mit der Diskografie dedupliziert.
# playlists:
#   - name: "This is Bounce"                          # Pflicht: Ordnername + Album-Tag
#     id: "PLUz4LXLKvZVAPbk7v56U0mgTBy5BPT3Qe"        # Pflicht: YT-Music Playlist-ID
#     artist: "HBz"                                   # optional: Top-Level Ordner
#     apply_filter: false                             # optional: Studio-Filter ausschalten (Default: true)
