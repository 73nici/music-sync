[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-sync"
version = "0.2.0"
description = "Analyze local music library and download missing songs from YouTube Music"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "ytmusicapi>=1.7.0",
    "yt-dlp>=2024.10.0",
    "yt-dlp-ejs>=0.2.0",
    "bgutil-ytdlp-pot-provider>=1.2.0",
    "mutagen>=1.47.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "PyYAML>=6.0",
    "rapidfuzz>=3.6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "pip-audit>=2.7",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
music-sync = "music_sync.cli:main"

[tool.setuptools.packages.find]
include = ["music_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["music_sync", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, UP pyupgrade, B bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["music_sync"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
